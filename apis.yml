name: Autobia
description: Autobia is a B2B e-commerce marketplace for the automotive aftermarket
  in Saudi Arabia, connecting auto-parts retailers, workshops, and service centers
  with wholesalers and dealers. The platform offers real-time pricing and instant
  ordering across more than 20,000 spare parts from multiple brands, centralizing
  sourcing to streamline procurement and improve supply-chain efficiency for the automotive
  sector. Backed by Techstars, Autobia operates via a web platform and native iOS
  and Android apps. No public developer API, documentation, or SDK is currently published.
